# 用語辞書（専門語の読みとアクセント）
#
# 誤読・アクセント崩れが実際に見つかった語だけを、人が足す。推測で埋めない。
# 書き方は references/terms.md。足したら `vs terms` で検査する（形が崩れていれば何行目の何が悪いかを出す）。
#
# 1語の例（コメントのまま。使うときは terms: [] を消して、下のように並べる）:
# terms:
#   - word: 型締力            # 台本に出てくる表記
#     reading: かたじめりょく  # ひらがな か カタカナ（ー も可）
#     accent: LHHHHL          # 1モーラ1文字の高低の列（references/accent.md）。type: 5 のように型の数字でもよい
#     note: Veo が「かせんりょく」と読んだ（任意のメモ）

terms: []
